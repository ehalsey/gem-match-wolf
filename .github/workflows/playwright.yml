name: Playwright E2E

on:
  # Only run on pull requests to avoid duplicate runs
  # (push to PR branch triggers both 'push' and 'pull_request' events)
  pull_request:
    branches: [ '**' ]
  # Also run on direct pushes to master (not via PR)
  push:
    branches: [ 'master' ]

# Prevent duplicate runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install Playwright browsers and system deps
        # --with-deps will install necessary system packages on hosted runners
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        # run with HTML reporter and retry failed tests twice for CI robustness
        run: npx playwright test --reporter=html --retries=2

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results || ''
